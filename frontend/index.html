<script>
/* Server auto-detection. The app shell can be reached from several ways:
   the installed app (http://127.0.0.1:8080), a static editor preview such as
   VS Code "Go Live" (port 5500, no PHP), or a hosted copy. The first
   candidate that answers /api/health wins. Synchronous probe runs before
   api.js loads so the first request already uses the right server. */
(function () {
  if (window.SMARTBOOK_API_BASE) return;
  var root = location.pathname.replace(/\/(index|admin)\.html.*$/, '').replace(/\/frontend\/.*$/, '').replace(/\/$/, '') || '';
  var candidates = [
    (location.origin.replace(/\/$/, '')) + (root.length ? root : '') + '/api',
    'http://127.0.0.1:8080/api'
  ];
  for (var i = 0; i < candidates.length; i++) {
    try {
      var x = new XMLHttpRequest();
      x.open('GET', candidates[i] + '/health', false);
      x.send(null);
      var j = JSON.parse(x.responseText);
      if (x.status === 200 && j && j.ok) { window.SMARTBOOK_API_BASE = candidates[i]; return; }
    } catch (e) { /* candidate unreachable, try the next */ }
  }
  window.SMARTBOOK_API_BASE = (root || '') + '/api';
})();
</script>
